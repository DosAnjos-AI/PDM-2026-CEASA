# Testes automáticos do pipeline de MLOps e da aplicação Streamlit.
# Rodam a cada push ou pull request que mexa em mlops/ ou app/, sem acesso ao GCP:
# o pipeline é testado com dados sintéticos e a aplicação com um BigQuery falso.
name: Testes

on:
  push:
    paths: ["mlops/**", "app/**", ".github/workflows/testes.yml"]
  pull_request:
    paths: ["mlops/**", "app/**", ".github/workflows/testes.yml"]

jobs:
  pipeline:
    name: Pipeline de MLOps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mlops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mlops/requirements-teste.txt
      - name: Instalar dependências
        run: pip install -r requirements-teste.txt
      - name: Rodar testes
        run: pytest

  aplicacao:
    name: Aplicação Streamlit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Rodar testes
        run: pytest

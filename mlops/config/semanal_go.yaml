# Configuração anterior (até a v0.4): preço semanal por embalagem, só CEASA-GO, 1 a 4 semanas.
# Mantida para reproduzir os resultados do artigo:
#   python -m pipeline.treinar --config config/semanal_go.yaml --experimento semanal_go

projeto: pdm-ceasa
dataset_mlops: mlops
local_bq: US
fuso: America/Sao_Paulo

fonte:
  tipo: analitica_semanal
  tabela: gold.analitica_semanal
  coluna_preco: media_preco_comum   # R$ por embalagem
  data_inicio: "2010-01-04"
  frequencia: W-MON                 # semanas começando na segunda
  min_periodos: 156                 # 3 anos contínuos
  sazonalidade: 52

clima:
  tabela: bronze.clima_historico
  cidade: Goiânia
  defasagem: 4                      # em semanas

validacao:
  horizontes: [1, 2, 3, 4]
  janelas: 12
  passo: 4
  janelas_holdout: 4

campeao:
  margem_serie: 0.03
  limiar_promocao: 0.01

features_ml:
  lags: [1, 2, 3, 4, 8, 13, 52]
  medias_moveis: [4, 12]
  datas: [month, semana_do_ano]

modelos:
  Naive:         {ativo: true}
  SeasonalNaive: {ativo: true}
  ARIMA:         {ativo: true}
  SARIMA:        {ativo: false}
  ETS:           {ativo: true}
  Theta:         {ativo: true}
  LightGBM:
    ativo: true
    tipo: lightgbm
    estrategia: recursiva
    clima: false
    params: &lgb_params
      n_estimators: 400
      learning_rate: 0.03
      num_leaves: 31
      min_child_samples: 20
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      random_state: 42
      verbosity: -1
  LightGBM_direto: {ativo: true, tipo: lightgbm, estrategia: direta, clima: false, params: *lgb_params}
  LightGBM_clima:  {ativo: true, tipo: lightgbm, estrategia: direta, clima: true, params: *lgb_params}
  LightGBM_otimizado:
    ativo: true
    tipo: lightgbm
    estrategia: direta
    clima: true
    params: *lgb_params
    otimizar: {trials: 25, janelas: 6, timeout_s: 900}
  Ridge: {ativo: true, tipo: ridge, estrategia: recursiva, clima: false, params: {alpha: 1.0}}
  Chronos2:       {ativo: true, tipo: chronos, repo: amazon/chronos-2}
  Chronos2_clima: {ativo: true, tipo: chronos, repo: amazon/chronos-2, clima: true}
  ChronosBolt:    {ativo: true, tipo: chronos, repo: amazon/chronos-bolt-base}
  ChronosT5:      {ativo: false, tipo: chronos, repo: amazon/chronos-t5-small}
